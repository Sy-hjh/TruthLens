[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verispoof"
version = "0.1.0"
description = "One audio language model for speech deepfake detection, source verification and grounded reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=5.13",  # Qwen3-ASR audio tower (transformers.models.qwen3_asr)
  "safetensors",
  "huggingface_hub",
  "soundfile",
  "librosa",
  "numpy",
]

[project.optional-dependencies]
vllm = ["vllm>=0.30"]  # faster reasoning (verispoof.vllm_backend); tested with 0.30.0

[tool.setuptools]
packages = ["verispoof"]
